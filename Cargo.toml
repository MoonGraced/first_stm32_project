[package]
name = "first_stm32_project"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
fugit = "0.3.7"
panic-halt = "1.0.0"
stm32f4xx-hal = { version = "0.22.1", features = ["gpio-f411", "stm32f411"] }


[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "s"
